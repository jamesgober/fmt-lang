# =============================================================================
#  R E P S   ·   fmt-lang
# =============================================================================
[package]
name    = "fmt-lang"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Rule-driven source formatter over lossless syntax trees, rendering through pretty-lang."

# Keywords (5 max)
keywords = ["formatter", "pretty-print", "syntax-tree", "language", "lexersketch"]

# Categories
categories = ["development-tools", "text-processing", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/fmt-lang"
repository    = "https://github.com/jamesgober/fmt-lang"
documentation = "https://docs.rs/fmt-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "fmt_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# `std` is forwarded to the tree and layout crates. Without it the crate is
# `no_std` and needs only `alloc`.
std = ["syntax-lang/std", "pretty-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The lossless CST the formatter walks: nodes, tokens, spans, trivia.
syntax-lang = { version = "1", default-features = false }
# The layout algebra the formatter renders through (Wadler/Lindig `Doc`).
pretty-lang = { version = "1.0.1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# Forges the test and example languages: real lossless trees with trivia,
# comments, and ERROR nodes, from crates.io (CI builds this repo standalone).
lang-forge = "1.0.1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
